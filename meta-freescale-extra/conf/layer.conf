BBPATH .= ":${LAYERDIR}"

BBFILES += "\
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-freescale-extra"
BBFILE_PATTERN_meta-freescale-extra = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-freescale-extra = "6"

LAYERDEPENDS_meta-freescale-extra += "freescale-layer"

LAYERSERIES_COMPAT_meta-freescale-extra = "wrynose"

BBFILES_DYNAMIC += " \
    virtualization-layer:${LAYERDIR}/dynamic-layers/virtualization-layer/recipes-*/*/*.bb \
    virtualization-layer:${LAYERDIR}/dynamic-layers/virtualization-layer/recipes-*/*/*.bbappend \
"
