require conf/machine/beaglebone-yocto.conf

MACHINEOVERRIDES =. "beaglebone-yocto:"

# Need to use a custom WIC kickstart file because the upstream
# one doesn't work with our kernel with bundled initramfs (boot
# partition not big enough).
WKS_FILE = "unit-beaglebone-yocto.wks"

DTB_FILES:append = " am335x-boneblack-custom.dtb"
