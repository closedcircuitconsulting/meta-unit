#
# Kernel 6.18+ split legacy iptables setsockopt support out of
# CONFIG_IP_NF_IPTABLES into CONFIG_IP_NF_IPTABLES_LEGACY, gated by
# CONFIG_NETFILTER_XTABLES_LEGACY. Podman/netavark's iptables backend
# needs this chain enabled or `iptables -t nat` fails with
# "Table does not exist" even when CONFIG_NF_NAT is set.
#
# Supplements features/netfilter/netfilter.cfg from yocto-kernel-cache,
# which predates this split.

CONFIG_NETFILTER_XTABLES_LEGACY=y
CONFIG_IP_NF_IPTABLES_LEGACY=m
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=m
CONFIG_BRIDGE_NETFILTER=m
