BBPATH .= ":${LAYERDIR}"

BBFILES += "\
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "sunxi-extra-layer"
BBFILE_PATTERN_sunxi-extra-layer = "^${LAYERDIR}/"
BBFILE_PRIORITY_sunxi-extra-layer = "11"

LAYERDEPENDS_sunxi-extra-layer += "sunxi"

LAYERSERIES_COMPAT_sunxi-extra-layer = "wrynose"

BBFILES_DYNAMIC += " \
    virtualization-layer:${LAYERDIR}/dynamic-layers/virtualization-layer/recipes-*/*/*.bb \
    virtualization-layer:${LAYERDIR}/dynamic-layers/virtualization-layer/recipes-*/*/*.bbappend \
"
